name: Wire Slice C correction UI

on:
  push:
    branches: [staging-startup-repair-20260814]
    paths:
      - '.github/workflows/slice-c-wire-correction-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-startup-repair-20260814
      - name: Load correction UI after the existing app scripts
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('assets/v24/v24_1_app4.js')
          s=p.read_text()
          marker="v24_1_correction.js"
          if marker not in s:
              s += "\nconst correctionUxScript=document.createElement('script');correctionUxScript.src='assets/v24/v24_1_correction.js';correctionUxScript.defer=true;document.body.appendChild(correctionUxScript);\n"
              p.write_text(s)
          PY
          node --check assets/v24/v24_1_app4.js
          node --check assets/v24/v24_1_correction.js
      - name: Commit correction UI wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/v24/v24_1_app4.js
          git commit -m 'Load audited correction UI in staging app'
          git push origin HEAD:staging-startup-repair-20260814
