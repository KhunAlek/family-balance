name: Wire Slice C correction dispatcher

on:
  push:
    branches: [staging-startup-repair-20260814]
    paths:
      - '.github/workflows/slice-c-wire-correction.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-startup-repair-20260814
      - name: Wire correction planner
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('cloudflare/slice-c/src/write-actions.mjs')
          s=p.read_text()
          imp="import { planCorrection } from './correction.mjs';\n"
          if imp not in s:
              marker="import { enumerateObligationOccurrences } from '../../slice-b/src/obligations.mjs';\n"
              if marker not in s: raise SystemExit('import marker not found')
              s=s.replace(marker,marker+imp)
          case="    case 'correctRecord': return planCorrection(ctx);\n"
          if case not in s:
              marker="    case 'oneOffPayment': return planOneOffPayment(ctx);\n"
              if marker not in s: raise SystemExit('switch marker not found')
              s=s.replace(marker,marker+case)
          p.write_text(s)
          PY
          node --check cloudflare/slice-c/src/write-actions.mjs
          node --check cloudflare/slice-c/src/correction.mjs
      - name: Commit dispatcher wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/slice-c/src/write-actions.mjs
          git commit -m 'Wire audited correction into Slice C dispatcher'
          git push origin HEAD:staging-startup-repair-20260814
