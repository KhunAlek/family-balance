name: Production cutover Gate 2 - provision isolated resources

on:
  push:
    branches: [production-cutover-20260815]
    paths:
      - '.github/workflows/production-cutover-gate2.yml'

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6ee48ea46390bcf76f1d924f4a7d88f1
      D1_NAME: family-cash-flow-production-v1
      R2_BUCKET: family-cash-flow-production-backups
      WORKER_NAME: family-cash-flow-production
    steps:
      - uses: actions/checkout@v4

      - name: Assert production names are unused
        run: |
          set -euo pipefail
          node <<'NODE'
          (async () => {
            const account = process.env.CLOUDFLARE_ACCOUNT_ID;
            const token = process.env.CLOUDFLARE_API_TOKEN;
            if (!token) throw new Error('CLOUDFLARE_API_TOKEN is unavailable');
            const get = async path => {
              const response = await fetch('https://api.cloudflare.com/client/v4' + path, {
                headers: { Authorization: 'Bearer ' + token }
              });
              const body = await response.json();
              if (!response.ok || body.success === false) throw new Error('Cloudflare precheck failed: ' + JSON.stringify(body.errors || []));
              return body.result;
            };
            const [workers, databases, r2Result] = await Promise.all([
              get('/accounts/' + account + '/workers/scripts'),
              get('/accounts/' + account + '/d1/database?per_page=100'),
              get('/accounts/' + account + '/r2/buckets?per_page=100')
            ]);
            const buckets = Array.isArray(r2Result?.buckets) ? r2Result.buckets : r2Result;
            if (workers.some(row => (row.id || row.name) === process.env.WORKER_NAME)) throw new Error('Production Worker name already exists');
            if (databases.some(row => row.name === process.env.D1_NAME)) throw new Error('Production D1 name already exists');
            if (buckets.some(row => row.name === process.env.R2_BUCKET)) throw new Error('Production R2 name already exists');
            console.log(JSON.stringify({status:'PASS',worker_name_unused:true,d1_name_unused:true,r2_name_unused:true}));
          })().catch(error => { console.error(String(error)); process.exit(1); });
          NODE

      - name: Create dedicated production D1
        run: npx --yes wrangler@4.123.0 d1 create "$D1_NAME" --location apac

      - name: Create dedicated private production R2 bucket
        run: npx --yes wrangler@4.123.0 r2 bucket create "$R2_BUCKET"

      - name: Resolve and verify exact resources
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          (async () => {
            const account = process.env.CLOUDFLARE_ACCOUNT_ID;
            const token = process.env.CLOUDFLARE_API_TOKEN;
            const get = async path => {
              const response = await fetch('https://api.cloudflare.com/client/v4' + path, {
                headers: { Authorization: 'Bearer ' + token }
              });
              const body = await response.json();
              if (!response.ok || body.success === false) throw new Error('Cloudflare verification failed: ' + JSON.stringify(body.errors || []));
              return body.result;
            };
            const [databases, r2Result, subdomain] = await Promise.all([
              get('/accounts/' + account + '/d1/database?per_page=100'),
              get('/accounts/' + account + '/r2/buckets?per_page=100'),
              get('/accounts/' + account + '/workers/subdomain')
            ]);
            const database = databases.find(row => row.name === process.env.D1_NAME);
            const buckets = Array.isArray(r2Result?.buckets) ? r2Result.buckets : r2Result;
            const bucket = buckets.find(row => row.name === process.env.R2_BUCKET);
            if (!database || !bucket) throw new Error('Created production resources cannot be resolved');
            if (/staging/i.test(database.name) || /staging/i.test(bucket.name)) throw new Error('Production resource contains staging');
            fs.writeFileSync('/tmp/production-resources.json', JSON.stringify({
              generated_at: new Date().toISOString(),
              account_id: account,
              worker_name: process.env.WORKER_NAME,
              worker_origin: 'https://' + process.env.WORKER_NAME + '.' + subdomain.subdomain + '.workers.dev',
              d1_name: database.name,
              d1_id: database.uuid || database.id,
              d1_version: database.version,
              d1_jurisdiction: database.jurisdiction,
              r2_bucket: bucket.name,
              r2_created_at: bucket.creation_date
            }, null, 2) + '\n');
            console.log(JSON.stringify({status:'PASS',d1_name:database.name,r2_bucket:bucket.name}));
          })().catch(error => { console.error(String(error)); process.exit(1); });
          NODE

      - name: Prove production D1 is application-empty
        run: |
          set -euo pipefail
          npx --yes wrangler@4.123.0 d1 execute "$D1_NAME" --remote --json --command "SELECT COUNT(*) AS application_tables FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%';" > /tmp/empty-check.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/empty-check.json'));
          const block=Array.isArray(x)?x[0]:x;
          const row=(block.results||block.result||[])[0];
          if (!row || Number(row.application_tables)!==0) throw new Error('Production D1 is not application-empty: '+JSON.stringify(row));
          console.log(JSON.stringify({status:'PASS',application_tables:0}));
          NODE

      - name: Record pre-import D1 Time Travel bookmark
        run: npx --yes wrangler@4.123.0 d1 time-travel info "$D1_NAME" --json > /tmp/pre-import-time-travel.json

      - name: Upload Gate 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-cutover-gate2
          path: |
            /tmp/production-resources.json
            /tmp/empty-check.json
            /tmp/pre-import-time-travel.json
          if-no-files-found: error
