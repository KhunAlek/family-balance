name: Cloudflare production deploy

on:
  push:
    branches: [main]
    paths:
      - '.assetsignore'
      - 'wrangler.production.jsonc'
      - 'index.html'
      - 'assets/**'
      - 'cloudflare/slice-b/**'
      - 'cloudflare/slice-c/**'
      - 'cloudflare/slice-d/**'
      - '.github/workflows/cloudflare-production-deploy.yml'

permissions:
  contents: read

concurrency:
  group: family-cash-flow-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6ee48ea46390bcf76f1d924f4a7d88f1
      WORKER_NAME: family-cash-flow-production
      WORKER_ORIGIN: https://family-cash-flow-production.abystrov66.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Assert immutable production configuration
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ! grep -i 'staging' wrangler.production.jsonc
          grep -Fq '"name": "family-cash-flow-production"' wrangler.production.jsonc
          grep -Fq '"database_id": "d605f4fb-f42a-4610-9805-1c4f8b8329b8"' wrangler.production.jsonc
          grep -Fq '"bucket_name": "family-cash-flow-production-backups"' wrangler.production.jsonc
          grep -Fq '"BACKUP_ENVIRONMENT": "production"' wrangler.production.jsonc
          grep -Fq '"0 21 * * SUN"' wrangler.production.jsonc
          grep -Fq '"0 20 * * *"' wrangler.production.jsonc

      - name: Run accepted tests and production dry run
        run: |
          set -euo pipefail
          (cd cloudflare/slice-b && npm test)
          (cd cloudflare/slice-c && npm test)
          (cd cloudflare/slice-d && npm test)
          find assets -name '*.js' -type f -print0 | xargs -0 -n1 node --check
          node --check cloudflare/slice-d/src/index.js
          npx --yes wrangler@4.123.0 deploy --config wrangler.production.jsonc --dry-run --outdir /tmp/production-dry-run

      - name: Deploy reviewed main commit
        run: npx --yes wrangler@4.123.0 deploy --config wrangler.production.jsonc

      - name: Install fresh production session-signing secret
        run: |
          set -euo pipefail
          openssl rand -base64 48 | npx --yes wrangler@4.123.0 secret put SESSION_SIGNING_KEY --name "$WORKER_NAME"

      - name: Verify health and record sanitized deployment evidence
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 60 --retry-all-errors --retry-delay 2 --retry-max-time 180 "$WORKER_ORIGIN/health" > /tmp/health.json
          npx --yes wrangler@4.123.0 secret list --name "$WORKER_NAME" --format json > /tmp/secrets.json
          node <<'NODE'
          const fs=require('fs');
          const health=JSON.parse(fs.readFileSync('/tmp/health.json'));
          const secrets=JSON.parse(fs.readFileSync('/tmp/secrets.json'));
          if(!secrets.some(x=>x.name==='SESSION_SIGNING_KEY')) throw new Error('SESSION_SIGNING_KEY is missing');
          const config=JSON.parse(fs.readFileSync('wrangler.production.jsonc'));
          const evidence={
            status:'PASS',
            commit:process.env.GITHUB_SHA,
            runId:process.env.GITHUB_RUN_ID,
            workerName:process.env.WORKER_NAME,
            origin:process.env.WORKER_ORIGIN,
            d1:config.d1_databases[0],
            r2:config.r2_buckets[0],
            crons:config.triggers.crons,
            secretNames:secrets.map(x=>x.name).sort(),
            health
          };
          fs.writeFileSync('/tmp/production-deployment-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log(JSON.stringify({status:evidence.status,commit:evidence.commit,workerName:evidence.workerName,origin:evidence.origin,secretNames:evidence.secretNames}));
          NODE

      - name: Upload sanitized deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-deployment-evidence
          path: /tmp/production-deployment-evidence.json
          if-no-files-found: error
