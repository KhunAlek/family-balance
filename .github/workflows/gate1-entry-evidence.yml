name: Gate 1 entry evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-durable-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6ee48ea46390bcf76f1d924f4a7d88f1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Query staging and production D1 read-only
        run: |
          set -euo pipefail
          for ENV in staging production; do
            if [ "$ENV" = staging ]; then DB=family-cash-flow-staging-v1; else DB=family-cash-flow-production-v1; fi
            npx --yes wrangler@4.123.0 d1 execute "$DB" --remote --json --command "SELECT type,name,tbl_name,sql FROM sqlite_master WHERE name IN ('cycle_plans','cycle_plan_events','cycle_commitments','commitment_events','goal_withdrawal_classifications','weekly_snapshot_model_versions','uq_cycle_commitment_identity','uq_cycle_commitment_household_id','uq_goal_withdrawal_classification_ledger','cycle_plan_events_append_only_update','cycle_plan_events_append_only_delete','commitment_events_append_only_update','commitment_events_append_only_delete','goal_withdrawal_classification_validate_insert') ORDER BY type,name;" > "/tmp/${ENV}-v3-schema.json"
            npx --yes wrangler@4.123.0 d1 execute "$DB" --remote --json --command "SELECT correction_id,entity_type,entity_id,base_revision,write_token,corrected_at,json_extract(after_json,'$.replacementForLedgerId') AS replacement_for_ledger_id,json_extract(after_json,'$.source_row') AS replacement_source_row,json_extract(after_json,'$.account') AS replacement_account,json_extract(after_json,'$.direction') AS replacement_direction,json_extract(after_json,'$.amount_satang') AS replacement_amount_satang FROM correction_audit WHERE entity_type IN ('ledger_movement','ledgerMovement') ORDER BY corrected_at,correction_id;" > "/tmp/${ENV}-ledger-corrections.json"
            npx --yes wrangler@4.123.0 d1 execute "$DB" --remote --json --command "SELECT ledger_id,business_date,sheet_order,account,direction,amount_satang,source_sheet,source_row FROM ledger_movements WHERE source_sheet='Correction' ORDER BY business_date,sheet_order,ledger_id;" > "/tmp/${ENV}-correction-ledger.json"
          done
          node <<'NODE'
          const fs=require('fs');
          const unwrap=p=>{const x=JSON.parse(fs.readFileSync(p)); const b=Array.isArray(x)?x[0]:x; return b?.results||b?.result||[]};
          const expectedTables=['cycle_plans','cycle_plan_events','cycle_commitments','commitment_events','goal_withdrawal_classifications','weekly_snapshot_model_versions'];
          const out={};
          for(const env of ['staging','production']){
            const schema=unwrap(`/tmp/${env}-v3-schema.json`);
            const corrections=unwrap(`/tmp/${env}-ledger-corrections.json`);
            const correctionLedger=unwrap(`/tmp/${env}-correction-ledger.json`);
            const tables=schema.filter(x=>x.type==='table').map(x=>x.name).sort();
            out[env]={v3ObjectCount:schema.length,v3TablesPresent:tables,allV3TablesPresent:expectedTables.every(x=>tables.includes(x)),ledgerCorrectionCount:corrections.length,ledgerCorrections:corrections,correctionLedgerRows:correctionLedger};
          }
          fs.writeFileSync('/tmp/g1-entry-evidence.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: gate-1-entry-evidence
          path: /tmp/g1-entry-evidence.json
