name: Cloudflare production deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: family-cash-flow-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6ee48ea46390bcf76f1d924f4a7d88f1
      WORKER_NAME: family-cash-flow-production
      WORKER_ORIGIN: https://family-cash-flow-production.abystrov66.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pinned application dependency
        run: npm ci --prefix cloudflare/slice-d --ignore-scripts --no-audit --no-fund

      - name: Assert reviewed commit, production configuration, and locked assets
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          ! grep -i 'staging' wrangler.production.jsonc
          grep -Fq '"name": "family-cash-flow-production"' wrangler.production.jsonc
          grep -Fq '"database_id": "d605f4fb-f42a-4610-9805-1c4f8b8329b8"' wrangler.production.jsonc
          grep -Fq '"bucket_name": "family-cash-flow-production-backups"' wrangler.production.jsonc
          node cloudflare/slice-d/tools/release-assets.mjs verify

      - name: Run accepted tests and build the candidate
        run: |
          set -euo pipefail
          (cd cloudflare/slice-b && npm test)
          (cd cloudflare/slice-c && npm test)
          (cd cloudflare/slice-d && npm test)
          find assets -name '*.js' -type f -print0 | xargs -0 -n1 node --check
          node --check cloudflare/slice-d/src/index.js
          node --check sw.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
          npx --yes wrangler@4.123.0 deploy --config wrangler.production.jsonc --dry-run --outdir /tmp/production-dry-run

      - name: Record production version and financial revision
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const api=`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}`;
          const headers={authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`};
          const deployments=await fetch(`${api}/workers/scripts/${process.env.WORKER_NAME}/deployments`,{headers}).then(r=>r.json());
          const current=deployments.result?.deployments?.[0]?.versions;
          if(!deployments.success||current?.length!==1||Number(current[0].percentage)!==100)throw new Error('Production is not on one known 100% version.');
          const query=await fetch(`${api}/d1/database/d605f4fb-f42a-4610-9805-1c4f8b8329b8/query`,{method:'POST',headers:{...headers,'content-type':'application/json'},body:JSON.stringify({sql:"SELECT current_revision FROM household_revisions WHERE household_id='family'"})}).then(r=>r.json());
          const batch=query.result?.[0],revision=batch?.results?.[0]?.current_revision;
          if(!query.success||!Number.isInteger(revision)||batch.meta?.changed_db!==false)throw new Error('Could not prove the D1 revision read was non-writing.');
          fs.writeFileSync('/tmp/prior-version',current[0].version_id+'\n');
          fs.writeFileSync('/tmp/prior-revision',String(revision)+'\n');
          NODE

      - name: Upload immutable candidate without production traffic
        id: upload
        run: |
          set -euo pipefail
          alias="candidate-${GITHUB_RUN_ID}"
          npx --yes wrangler@4.123.0 versions upload --config wrangler.production.jsonc --preview-alias "$alias" --message "Reviewed commit $GITHUB_SHA" | tee /tmp/candidate-upload.log
          node <<'NODE'
          const fs=require('fs'),value=fs.readFileSync('/tmp/candidate-upload.log','utf8');
          const version=value.match(/(?:Current )?Version ID:\s*([^\s]+)/)?.[1];
          if(!version)throw new Error('Wrangler did not report a candidate version ID.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`version=${version}\norigin=https://candidate-${process.env.GITHUB_RUN_ID}-${process.env.WORKER_NAME}.abystrov66.workers.dev\n`);
          NODE

      - name: Verify every candidate asset and MIME type
        env:
          CANDIDATE_ORIGIN: ${{ steps.upload.outputs.origin }}
        run: node cloudflare/slice-d/tools/verify-release-preview.mjs

      - name: Verify candidate visually on a phone viewport
        env:
          CANDIDATE_ORIGIN: ${{ steps.upload.outputs.origin }}
        run: |
          set -euo pipefail
          npm install playwright@1.54.2 --no-save --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          node cloudflare/slice-d/tools/verify-release-browser.mjs

      - name: Upload candidate screenshot
        uses: actions/upload-artifact@v4
        with:
          name: production-candidate-phone
          path: /tmp/production-candidate-phone.png
          if-no-files-found: error

      - name: Deploy the already-verified candidate once
        id: deploy_candidate
        run: npx --yes wrangler@4.123.0 versions deploy '${{ steps.upload.outputs.version }}@100%' -y --config wrangler.production.jsonc

      - name: Verify live release and unchanged financial revision
        env:
          CANDIDATE_ORIGIN: ${{ env.WORKER_ORIGIN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if node cloudflare/slice-d/tools/verify-release-preview.mjs; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo 'Live release did not converge to the reviewed asset lock within two minutes.' >&2
              exit 1
            fi
            sleep 10
          done
          auth_code=$(curl -sS -H 'accept: application/json' -o /tmp/auth.json -w '%{http_code}' "$WORKER_ORIGIN/api/auth/session")
          test "$auth_code" = 401
          node -e "const x=require('/tmp/auth.json');if(!(x.ok===false&&/Authentication required/.test(x.error)))process.exit(1)"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const before=Number(fs.readFileSync('/tmp/prior-revision','utf8').trim());
          const url=`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/d1/database/d605f4fb-f42a-4610-9805-1c4f8b8329b8/query`;
          const body=await fetch(url,{method:'POST',headers:{authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'content-type':'application/json'},body:JSON.stringify({sql:"SELECT current_revision FROM household_revisions WHERE household_id='family'"})}).then(r=>r.json());
          const batch=body.result?.[0],after=batch?.results?.[0]?.current_revision;
          if(!body.success||batch.meta?.changed_db!==false||after!==before)throw new Error(`Deployment changed D1 revision ${before} -> ${after}.`);
          NODE

      - name: Roll back automatically if post-deployment verification fails
        if: failure() && steps.deploy_candidate.outcome == 'success'
        run: |
          prior=$(tr -d '\n' < /tmp/prior-version)
          npx --yes wrangler@4.123.0 versions deploy "${prior}@100%" -y --config wrangler.production.jsonc
