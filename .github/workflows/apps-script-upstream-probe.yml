name: Apps Script upstream probe

on:
  push:
    branches: [staging-startup-repair-20260814]
    paths:
      - '.github/workflows/apps-script-upstream-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probe v53 and prior deployment
        run: |
          node <<'NODE'
          const endpoints = {
            v53: 'https://script.google.com/macros/s/AKfycbzJHbXZPiYPCfYGmG3CYd9dryXk0r8clMYgGsV73T7KzHEwshxBP_z5RjX700EBMOTBAg/exec',
            prior: 'https://script.google.com/macros/s/AKfycbwtgB7WGkR-XRe19xda5xWmxPg4d_uymyu7wk-Vc0HEQpWdOHTuJ48pj1BIADZ8nOqLUA/exec'
          };
          const body = JSON.stringify({apiAction:'authBootstrap',googleAccessToken:'fcf-intentionally-invalid-staging-token'});
          for (const [name,url] of Object.entries(endpoints)) {
            for (const redirect of ['manual','follow']) {
              try {
                const r = await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body,redirect});
                const text = await r.text();
                console.log(JSON.stringify({name,redirect,status:r.status,url:r.url,location:r.headers.get('location'),contentType:r.headers.get('content-type'),body:text.slice(0,300)}));
              } catch (e) {
                console.log(JSON.stringify({name,redirect,error:String(e&&e.message||e)}));
              }
            }
          }
          NODE
