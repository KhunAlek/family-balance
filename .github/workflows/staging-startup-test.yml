name: Staging startup browser test

on:
  push:
    branches: [staging-startup-repair-20260814]
  workflow_dispatch:

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2 --no-save
          npx playwright install --with-deps chromium
      - name: Serve staging branch locally
        run: |
          python3 -m http.server 4173 >/tmp/fcf-http.log 2>&1 &
          echo $! > /tmp/fcf-http.pid
          sleep 2
      - name: Run startup and transport tests
        run: |
          cat > staging-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const BACKEND_URL='https://script.google.com/macros/s/AKfycbzJHbXZPiYPCfYGmG3CYd9dryXk0r8clMYgGsV73T7KzHEwshxBP_z5RjX700EBMOTBAg/exec';
          const html = fs.readFileSync('index.html','utf8');
          if (!html.includes('<script src="assets/v24/v24_1_app4.js"></script>')) {
            throw new Error('Direct app4 reference is missing from index.html');
          }
          if (html.includes('assets/v24/v24/v24_1_app4.js')) {
            throw new Error('Obsolete nested app4 reference is still present in index.html');
          }

          const app2 = fs.readFileSync('assets/v24/v24_1_app2.js','utf8');
          if (!app2.includes(`fetch('${BACKEND_URL}'`)) {
            throw new Error('Direct fetch transport is not pointed at the current Apps Script deployment');
          }
          if (app2.includes("document.createElement('iframe')") || app2.includes('form.submit()')) {
            throw new Error('Obsolete iframe/form transport is still present in app2');
          }

          const browser = await chromium.launch({headless:true});
          const results = [];

          async function runCase(name, viewport) {
            const context = await browser.newContext({viewport});
            const page = await context.newPage();
            const pageErrors = [];
            const localFailures = [];
            const requested = [];
            let nestedLoaderRequested = false;

            page.on('pageerror', e => pageErrors.push(String(e)));
            page.on('request', r => {
              requested.push(r.url());
              if (r.url().includes('/assets/v24/v24/v24_1_app4.js')) nestedLoaderRequested = true;
            });
            page.on('requestfailed', r => {
              if (r.url().startsWith('http://127.0.0.1:4173/')) {
                localFailures.push(`${r.url()} :: ${r.failure()?.errorText || 'failed'}`);
              }
            });

            // Poison the obsolete loader URL. A correct repaired page must never request it.
            await page.route('**/assets/v24/v24/v24_1_app4.js', route =>
              route.fulfill({status:200,contentType:'application/javascript',body:"throw new Error('obsolete loader executed')"})
            );

            const response = await page.goto('http://127.0.0.1:4173/index.html?case='+name, {waitUntil:'domcontentloaded',timeout:30000});
            if (!response || !response.ok()) throw new Error(`${name}: page HTTP ${response?.status()}`);
            await page.waitForTimeout(3000);

            const loadingVisible = await page.locator('#loadingState').isVisible().catch(()=>false);
            const authVisible = await page.locator('#authGate').isVisible().catch(()=>false);
            const loginVisible = await page.locator('#googleLoginBtn').isVisible().catch(()=>false);
            const errorVisible = await page.locator('#errorState').isVisible().catch(()=>false);
            const app4Requests = requested.filter(u=>u.includes('/assets/v24/v24_1_app4.js'));

            const result = {name,viewport,loadingVisible,authVisible,loginVisible,errorVisible,pageErrors,localFailures,nestedLoaderRequested,app4Requests};
            results.push(result);
            await page.screenshot({path:`staging-${name}.png`,fullPage:true});
            await context.close();

            if (nestedLoaderRequested) throw new Error(`${name}: obsolete nested loader was requested`);
            if (app4Requests.length !== 1) throw new Error(`${name}: expected exactly one direct app4 request, got ${app4Requests.length}`);
            if (pageErrors.length) throw new Error(`${name}: page errors: ${pageErrors.join(' | ')}`);
            if (localFailures.length) throw new Error(`${name}: local request failures: ${localFailures.join(' | ')}`);
            if (errorVisible) throw new Error(`${name}: app error state visible`);
            if (loadingVisible) throw new Error(`${name}: loading screen still visible`);
            if (!authVisible || !loginVisible) throw new Error(`${name}: Google sign-in gate not visible`);
          }

          async function runTransportProbe() {
            const context = await browser.newContext({viewport:{width:390,height:844}});
            const page = await context.newPage();
            const pageErrors = [];
            page.on('pageerror', e => pageErrors.push(String(e)));

            const response = await page.goto('http://127.0.0.1:4173/index.html?case=transport', {waitUntil:'domcontentloaded',timeout:30000});
            if (!response || !response.ok()) throw new Error(`transport: page HTTP ${response?.status()}`);
            await page.waitForTimeout(500);

            const probe = await Promise.race([
              page.evaluate(async()=>{
                const started=Date.now();
                try {
                  const result=await rawApi({apiAction:'authBootstrap',googleAccessToken:'fcf-intentionally-invalid-staging-token'});
                  return {elapsedMs:Date.now()-started,result};
                } catch (err) {
                  return {elapsedMs:Date.now()-started,error:String(err&&err.message||err)};
                }
              }),
              new Promise(resolve=>setTimeout(()=>resolve({probeTimeout:true}),12000))
            ]);

            await context.close();
            results.push({name:'transport',probe,pageErrors});

            if (pageErrors.length) throw new Error(`transport: page errors: ${pageErrors.join(' | ')}`);
            if (probe.probeTimeout) throw new Error('transport: rawApi did not settle within 12 seconds');
            if (probe.error) throw new Error('transport: rawApi threw instead of returning backend JSON: '+probe.error);
            if (!probe.result || probe.result.ok !== false) throw new Error('transport: invalid Google token should produce structured backend rejection: '+JSON.stringify(probe));
            const backendError=String(probe.result.error||'');
            if (/script\.external_request|permission to call UrlFetchApp\.fetch/i.test(backendError)) {
              throw new Error('transport: Apps Script still lacks deployer UrlFetch authorization: '+backendError);
            }
            if (!/Google sign-in could not be verified/i.test(backendError)) {
              throw new Error('transport: unexpected backend rejection for invalid Google token: '+backendError);
            }
            if (probe.elapsedMs > 10000) throw new Error('transport: rawApi was unexpectedly slow: '+probe.elapsedMs+'ms');
          }

          await runCase('mobile',{width:390,height:844});
          await runCase('desktop',{width:1440,height:900});
          await runTransportProbe();
          console.log(JSON.stringify(results,null,2));
          await browser.close();
          EOF
          node staging-smoke.mjs
      - name: Upload staging screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-startup-screenshots
          path: staging-*.png
          if-no-files-found: ignore
