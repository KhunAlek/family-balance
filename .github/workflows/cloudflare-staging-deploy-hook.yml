name: Cloudflare staging deploy hook

on:
  push:
    branches: [staging-startup-repair-20260814]
    paths:
      - 'wrangler.jsonc'
      - 'cloudflare/slice-a-bridge/**'
      - 'assets/v24/**'
      - '.github/workflows/cloudflare-staging-deploy-hook.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger Cloudflare staging build
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_STAGING_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "Cloudflare staging deploy hook secret is not configured yet; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            "$DEPLOY_HOOK_URL"
