name: Harden Slice C correction edge cases

on:
  push:
    branches: [staging-startup-repair-20260814]
    paths:
      - '.github/workflows/slice-c-harden-correction.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-startup-repair-20260814
      - name: Preserve partial balances and salary source membership
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('cloudflare/slice-c/src/correction.mjs')
          s=p.read_text()
          old="""  const alex = own(values,'alexBalance') ? nonNegative(values.alexBalance,'Alex balance') : thb(before.alex_balance_satang);\n  const olga = own(values,'olgaBalance') ? nonNegative(values.olgaBalance,'Olga balance') : thb(before.olga_balance_satang);\n"""
          new="""  const correctedBalanceValue = (field, label, beforeSatang) => {\n    if (!own(values, field)) return beforeSatang === null || beforeSatang === undefined ? null : thb(beforeSatang);\n    const submitted = values[field];\n    return submitted === '' || submitted === null || submitted === undefined ? null : nonNegative(submitted, label);\n  };\n  const alex = correctedBalanceValue('alexBalance','Alex balance',before.alex_balance_satang);\n  const olga = correctedBalanceValue('olgaBalance','Olga balance',before.olga_balance_satang);\n"""
          if old not in s: raise SystemExit('balance value block not found')
          s=s.replace(old,new)
          s=s.replace("    alex_balance_satang: toSatang(alex),\n    olga_balance_satang: toSatang(olga),", "    alex_balance_satang: alex === null ? null : toSatang(alex),\n    olga_balance_satang: olga === null ? null : toSatang(olga),")
          s=s.replace("    ctx.householdId,businessDate,id.sheetOrder,toSatang(alex),toSatang(olga),before.one_off_payment_name ?? null,", "    ctx.householdId,businessDate,id.sheetOrder,alex === null ? null : toSatang(alex),olga === null ? null : toSatang(olga),before.one_off_payment_name ?? null,")
          old_salary="""  const after={...asPlain(before),current_cycle_start:start,next_salary_date:next};\n  return {statements:[\n    statement('UPDATE salary_cycle_state SET current_cycle_start=?,next_salary_date=? WHERE household_id=?',start,next,ctx.householdId),\n    auditStatement(ctx,'salary_cycle',ctx.householdId,asPlain(before),after,reason)\n  ],response:{correction:{entityType:'salaryCycle',entityId:ctx.householdId,before:asPlain(before),after}}};\n"""
          new_salary="""  const after={...asPlain(before),current_cycle_start:start,next_salary_date:next};\n  const statements=[statement('UPDATE salary_cycle_state SET current_cycle_start=?,next_salary_date=? WHERE household_id=?',start,next,ctx.householdId)];\n  if(start!==before.current_cycle_start){\n    const activeSources=(ctx.snapshot.salaryCycleSources||[]).filter(item=>item.cycle_start===before.current_cycle_start).map(item=>item.source);\n    statements.push(statement('DELETE FROM salary_cycle_sources WHERE household_id=? AND cycle_start=?',ctx.householdId,before.current_cycle_start));\n    for(const source of activeSources) statements.push(statement('INSERT OR IGNORE INTO salary_cycle_sources(household_id,cycle_start,source) VALUES(?,?,?)',ctx.householdId,start,source));\n  }\n  statements.push(auditStatement(ctx,'salary_cycle',ctx.householdId,asPlain(before),after,reason));\n  return {statements,response:{correction:{entityType:'salaryCycle',entityId:ctx.householdId,before:asPlain(before),after}}};\n"""
          if old_salary not in s: raise SystemExit('salary correction block not found')
          s=s.replace(old_salary,new_salary)
          p.write_text(s)
          PY
          node --check cloudflare/slice-c/src/correction.mjs
      - name: Commit hardening
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/slice-c/src/correction.mjs
          git commit -m 'Preserve partial balances and salary sources in corrections'
          git push origin HEAD:staging-startup-repair-20260814
