name: Staging Apps Script access control

on:
  push:
    branches:
      - staging-startup-repair-20260814
    paths:
      - '.github/workflows/staging-apps-access-control.yml'

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2 --no-save
          npx playwright install --with-deps chromium
      - name: Compare top-level and non-frame access
        run: |
          cat > access-control.mjs <<'EOF'
          import { chromium, request } from 'playwright';
          const APPS='https://script.google.com/macros/s/AKfycbwtgB7WGkR-XRe19xda5xWmxPg4d_uymyu7wk-Vc0HEQpWdOHTuJ48pj1BIADZ8nOqLUA/exec';
          const form={
            transport:'iframe',
            requestId:'fcf_control_fixed',
            requestJson:JSON.stringify({apiAction:'authBootstrap',googleAccessToken:'fcf-intentionally-invalid-token-control'})
          };
          const out={};

          const api=await request.newContext();
          const getResp=await api.get(APPS,{maxRedirects:20});
          out.apiGet={status:getResp.status(),url:getResp.url(),body:(await getResp.text()).slice(0,4000)};
          const postResp=await api.post(APPS,{form,maxRedirects:20});
          out.apiPost={status:postResp.status(),url:postResp.url(),body:(await postResp.text()).slice(0,4000)};
          await api.dispose();

          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext();
          const page=await context.newPage();
          const consoleErrors=[];
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
          const topGet=await page.goto(APPS,{waitUntil:'domcontentloaded',timeout:30000});
          out.browserTopGet={status:topGet?.status(),url:page.url(),title:await page.title(),body:(await page.locator('body').innerText().catch(()=>'' )).slice(0,2000),consoleErrors};
          await browser.close();

          console.log(JSON.stringify(out,null,2));
          EOF
          node access-control.mjs
