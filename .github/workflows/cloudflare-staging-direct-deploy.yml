name: Cloudflare staging direct deploy

on:
  push:
    branches: [staging-startup-repair-20260814]
    paths:
      - '.cloudflare-direct-deploy-trigger'
      - '.assetsignore'
      - 'wrangler.jsonc'
      - 'index.html'
      - 'assets/**'
      - 'cloudflare/slice-b/**'
      - 'cloudflare/slice-c/**'
      - 'cloudflare/slice-d/**'
      - '.github/workflows/cloudflare-staging-direct-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Web Push dependency
        run: npm ci --prefix cloudflare/slice-d --ignore-scripts --no-audit --no-fund
      - name: Ensure staging R2 backup bucket exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6ee48ea46390bcf76f1d924f4a7d88f1
        run: |
          set -euo pipefail
          npx --yes wrangler@4.123.0 r2 bucket list > /tmp/r2-buckets.txt
          if ! grep -Fq 'family-cash-flow-staging-backups' /tmp/r2-buckets.txt; then
            npx --yes wrangler@4.123.0 r2 bucket create family-cash-flow-staging-backups
          fi
      - name: Ensure signed-session secret exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6ee48ea46390bcf76f1d924f4a7d88f1
        run: |
          set -euo pipefail
          npx --yes wrangler@4.123.0 secret list --name family-cash-flow-staging-bridge --format json > /tmp/worker-secrets.json
          if ! node -e "const x=require('/tmp/worker-secrets.json'); process.exit(x.some(v=>v.name==='SESSION_SIGNING_KEY')?0:1)"; then
            openssl rand -base64 48 | npx --yes wrangler@4.123.0 secret put SESSION_SIGNING_KEY --name family-cash-flow-staging-bridge
          fi
      - name: Ensure persistent staging VAPID key pair exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6ee48ea46390bcf76f1d924f4a7d88f1
        run: |
          set -euo pipefail
          npx --yes wrangler@4.123.0 secret list --name family-cash-flow-staging-bridge --format json > /tmp/staging-secrets.json
          if ! node -e "const x=require('/tmp/staging-secrets.json'); process.exit(x.some(v=>v.name==='VAPID_PUBLIC_KEY')&&x.some(v=>v.name==='VAPID_PRIVATE_KEY')?0:1)"; then
            (cd cloudflare/slice-d && node --input-type=module <<'NODE'
          import { generateVAPIDKeys } from 'web-push-neo';
          import fs from 'node:fs';
          const keys = await generateVAPIDKeys();
          fs.writeFileSync('/tmp/vapid-public', keys.publicKey, { mode: 0o600 });
          fs.writeFileSync('/tmp/vapid-private', keys.privateKey, { mode: 0o600 });
          NODE
            )
            npx --yes wrangler@4.123.0 secret put VAPID_PUBLIC_KEY --name family-cash-flow-staging-bridge < /tmp/vapid-public
            npx --yes wrangler@4.123.0 secret put VAPID_PRIVATE_KEY --name family-cash-flow-staging-bridge < /tmp/vapid-private
            shred -u /tmp/vapid-public /tmp/vapid-private
          fi
      - name: Apply idempotent Web Push schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6ee48ea46390bcf76f1d924f4a7d88f1
        run: npx --yes wrangler@4.123.0 d1 execute family-cash-flow-staging-v1 --remote --config wrangler.jsonc --file cloudflare/slice-d/migrations/0004_web_push_notifications.sql
      - name: Deploy Slice D same-origin staging Worker with Wrangler 4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6ee48ea46390bcf76f1d924f4a7d88f1
        run: npx --yes wrangler@4.123.0 deploy --config wrangler.jsonc
