name: Production cutover attempt 2 - Gate 2 backup

on:
  push:
    branches: [production-cutover-attempt2-20260815]
    paths:
      - '.github/workflows/production-cutover-attempt2-gate2.yml'

permissions:
  contents: read

jobs:
  reconcile-bookmark-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6ee48ea46390bcf76f1d924f4a7d88f1
      D1_NAME: family-cash-flow-production-v1
      D1_ID: d605f4fb-f42a-4610-9805-1c4f8b8329b8
      R2_BUCKET: family-cash-flow-production-backups
      TEMP_BACKUP_WORKER: fcf-production-attempt2-backup-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Assert pinned source and isolated production identifiers
        run: |
          set -euo pipefail
          test "$(git rev-parse refs/remotes/origin/staging-startup-repair-20260814)" = "9e431c3af526de18e9060b96d19e593618bc7519"
          git cat-file -e b8066667efe19dfee455f38439c49b82107bf3ff^{commit}
          git merge-base --is-ancestor 9e431c3af526de18e9060b96d19e593618bc7519 HEAD
          ! grep -i 'staging' wrangler.production.jsonc
          grep -Fq '"database_id": "d605f4fb-f42a-4610-9805-1c4f8b8329b8"' wrangler.production.jsonc
          grep -Fq '"bucket_name": "family-cash-flow-production-backups"' wrangler.production.jsonc
          grep -Fq '"BACKUP_ENVIRONMENT": "production"' wrangler.production.jsonc

      - name: Run accepted regression tests and production dry run
        run: |
          set -euo pipefail
          (cd cloudflare/slice-b && npm test)
          (cd cloudflare/slice-c && npm test)
          (cd cloudflare/slice-d && npm test)
          find assets -name '*.js' -type f -print0 | xargs -0 -n1 node --check
          node --check cloudflare/slice-d/src/index.js
          npx --yes wrangler@4.123.0 deploy --config wrangler.production.jsonc --dry-run --outdir /tmp/production-dry-run

      - name: Prove preserved D1 reconciles with accepted source
        run: |
          set -euo pipefail
          node cloudflare/slice-b/tools/build-import.mjs /tmp/import.sql /tmp/source-report.json
          npx --yes wrangler@4.123.0 d1 export "$D1_NAME" --remote --output /tmp/production-d1-export.sql
          rm -f /tmp/production-export.db
          sqlite3 /tmp/production-export.db < /tmp/production-d1-export.sql
          sqlite3 /tmp/production-export.db "PRAGMA foreign_key_check;" > /tmp/export-fk.txt
          test ! -s /tmp/export-fk.txt
          node cloudflare/slice-b/tools/verify-import.mjs /tmp/production-export.db /tmp/source-report.json /tmp/remote-import-report.json
          QUERY="SELECT (SELECT COUNT(*) FROM balance_history) balance_rows,(SELECT COUNT(*) FROM ledger_movements) ledger_rows,(SELECT COUNT(*) FROM obligation_payments) payment_rows,(SELECT COUNT(*) FROM weekly_snapshots) weekly_rows,(SELECT COUNT(*) FROM financial_write_claims) claim_rows,(SELECT COUNT(*) FROM correction_audit) correction_rows,(SELECT current_revision FROM household_revisions WHERE household_id='family') revision,(SELECT COUNT(*) FROM salary_cycle_sources) salary_cycle_source_rows,(SELECT business_date FROM balance_history WHERE alex_balance_satang IS NOT NULL AND olga_balance_satang IS NOT NULL ORDER BY business_date DESC,sheet_order DESC LIMIT 1) latest_balance_date,(SELECT alex_balance_satang FROM balance_history WHERE alex_balance_satang IS NOT NULL AND olga_balance_satang IS NOT NULL ORDER BY business_date DESC,sheet_order DESC LIMIT 1) latest_alex,(SELECT olga_balance_satang FROM balance_history WHERE alex_balance_satang IS NOT NULL AND olga_balance_satang IS NOT NULL ORDER BY business_date DESC,sheet_order DESC LIMIT 1) latest_olga;"
          npx --yes wrangler@4.123.0 d1 execute "$D1_NAME" --remote --json --command "$QUERY" > /tmp/remote-state.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/remote-state.json'));
          const b=Array.isArray(x)?x[0]:x;
          const r=(b.results||b.result||[])[0];
          const expected={balance_rows:69,ledger_rows:3,payment_rows:8,weekly_rows:8,claim_rows:0,correction_rows:0,revision:0,salary_cycle_source_rows:2,latest_balance_date:'2026-08-12',latest_alex:228500,latest_olga:1145500};
          for(const [key,value] of Object.entries(expected)) if(String(r[key])!==String(value)) throw new Error('Remote state mismatch '+key);
          NODE

      - name: Record second-attempt pre-cutover bookmark
        run: npx --yes wrangler@4.123.0 d1 time-travel info "$D1_NAME" --json > /tmp/attempt2-time-travel.json

      - name: Deploy isolated backup worker
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('/tmp/production-backup-wrangler.json',JSON.stringify({
            name:process.env.TEMP_BACKUP_WORKER,
            main:process.env.GITHUB_WORKSPACE+'/cloudflare/slice-d/remote-test/src/production-backup.js',
            compatibility_date:'2026-08-14',
            compatibility_flags:['nodejs_compat'],
            observability:{enabled:true,head_sampling_rate:1},
            d1_databases:[{binding:'DB',database_name:process.env.D1_NAME,database_id:process.env.D1_ID}],
            r2_buckets:[{binding:'BACKUPS',bucket_name:process.env.R2_BUCKET}]
          },null,2));
          NODE
          npx --yes wrangler@4.123.0 deploy --config /tmp/production-backup-wrangler.json

      - name: Create and verify fresh portable backup
        run: |
          set -euo pipefail
          ORIGIN="https://$TEMP_BACKUP_WORKER.abystrov66.workers.dev"
          curl --fail-with-body --retry 60 --retry-all-errors --retry-delay 2 --retry-max-time 180 "$ORIGIN/health"
          curl --fail-with-body --retry 60 --retry-all-errors --retry-delay 2 --retry-max-time 180 --output /tmp/backup-result.json -X POST "$ORIGIN/backup"
          BACKUP_KEY="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/backup-result.json')).key")"
          npx --yes wrangler@4.123.0 r2 object get "$R2_BUCKET/$BACKUP_KEY" --remote --file /tmp/portable-backup.json
          node cloudflare/slice-d/tools/portable-restore.mjs /tmp/portable-backup.json /tmp/portable-restore.sql
          node <<'NODE'
          const fs=require('fs');
          const result=JSON.parse(fs.readFileSync('/tmp/backup-result.json'));
          const backup=JSON.parse(fs.readFileSync('/tmp/portable-backup.json'));
          if(!result.ok||!String(result.key).startsWith('production/'))throw new Error('Production backup failed');
          if(backup.format!=='family-cash-flow-d1-portable-v2'||backup.environment!=='production')throw new Error('Backup identity mismatch');
          if(Object.keys(backup.tables).length!==16)throw new Error('Wrong application table count');
          const providerObjects=backup.schema.filter(x=>/^(sqlite_|_cf_)/i.test(String(x.name||'')));
          if(providerObjects.length)throw new Error('Provider-owned schema objects included');
          const summary={status:'PASS',key:result.key,format:backup.format,environment:backup.environment,createdAt:backup.createdAt,applicationTableCount:Object.keys(backup.tables).length,schemaObjectCount:backup.schema.length,rowCounts:backup.integrity.rowCounts,tablesSha256:backup.integrity.tablesSha256,payloadSha256:backup.integrity.payloadSha256};
          fs.writeFileSync('/tmp/backup-verification.json',JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify(summary));
          NODE

      - name: Delete isolated backup worker
        if: always()
        run: npx --yes wrangler@4.123.0 delete --name "$TEMP_BACKUP_WORKER" --force || true

      - name: Upload Gate 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-cutover-attempt2-gate2
          path: |
            /tmp/source-report.json
            /tmp/remote-import-report.json
            /tmp/remote-state.json
            /tmp/attempt2-time-travel.json
            /tmp/backup-result.json
            /tmp/backup-verification.json
          if-no-files-found: error
