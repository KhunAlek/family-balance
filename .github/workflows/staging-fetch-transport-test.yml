name: Staging direct fetch transport test

on:
  push:
    branches:
      - staging-startup-repair-20260814
    paths:
      - '.github/workflows/staging-fetch-transport-test.yml'

permissions:
  contents: read

jobs:
  fetch-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2 --no-save
          npx playwright install --with-deps chromium
      - name: Test browser fetch from GitHub Pages origin
        run: |
          cat > fetch-transport.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const APPS='https://script.google.com/macros/s/AKfycbwtgB7WGkR-XRe19xda5xWmxPg4d_uymyu7wk-Vc0HEQpWdOHTuJ48pj1BIADZ8nOqLUA/exec';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext();
          const page=await context.newPage();
          const root=process.cwd();
          const events=[];
          page.on('console',m=>events.push({type:'console',level:m.type(),text:m.text()}));
          page.on('requestfailed',r=>events.push({type:'requestfailed',url:r.url(),error:r.failure()?.errorText||'failed'}));
          page.on('response',async r=>{if(r.url().includes('script.google'))events.push({type:'response',url:r.url(),status:r.status(),headers:await r.allHeaders().catch(()=>({}))})});
          const mime=file=>file.endsWith('.html')?'text/html; charset=utf-8':file.endsWith('.js')?'application/javascript; charset=utf-8':file.endsWith('.css')?'text/css; charset=utf-8':file.endsWith('.svg')?'image/svg+xml':'application/octet-stream';
          await page.route('https://khunalek.github.io/family-balance/**',async route=>{
            const u=new URL(route.request().url());
            let rel=decodeURIComponent(u.pathname.replace(/^\/family-balance\/?/,''));
            if(!rel)rel='index.html';
            const file=path.resolve(root,rel);
            if(!file.startsWith(root)||!fs.existsSync(file)||fs.statSync(file).isDirectory())return route.fulfill({status:404,body:'not found'});
            return route.fulfill({status:200,contentType:mime(file),body:fs.readFileSync(file)});
          });
          await page.route('https://accounts.google.com/gsi/client',r=>r.fulfill({status:200,contentType:'application/javascript',body:'window.google=window.google||{};'}));
          await page.route('https://cdn.jsdelivr.net/**',r=>r.fulfill({status:200,contentType:'application/javascript',body:''}));
          await page.route('https://fonts.googleapis.com/**',r=>r.fulfill({status:200,contentType:'text/css',body:''}));
          await page.route('https://fonts.gstatic.com/**',r=>r.fulfill({status:204,body:''}));

          await page.goto('https://khunalek.github.io/family-balance/?fetch-transport=1',{waitUntil:'domcontentloaded'});
          const result=await page.evaluate(async APPS=>{
            const tests={};
            try{
              const r=await fetch(APPS,{method:'GET',redirect:'follow'});
              tests.get={ok:r.ok,status:r.status,url:r.url,type:r.type,text:(await r.text()).slice(0,1000)};
            }catch(e){tests.get={error:String(e)}}
            try{
              const params=new URLSearchParams();
              params.set('requestJson',JSON.stringify({apiAction:'authBootstrap',googleAccessToken:'fcf-invalid-fetch-probe'}));
              const r=await fetch(APPS,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:params.toString(),redirect:'follow'});
              tests.post={ok:r.ok,status:r.status,url:r.url,type:r.type,text:(await r.text()).slice(0,1000)};
            }catch(e){tests.post={error:String(e)}}
            return tests;
          },APPS);
          console.log(JSON.stringify({result,events},null,2));
          await browser.close();
          EOF
          node fetch-transport.mjs
