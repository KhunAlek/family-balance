name: Slice C staging D1 salary-source migration

on:
  push:
    branches: [staging-startup-repair-20260814]
    paths:
      - '.github/workflows/slice-c-d1-salary-source-migrate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6ee48ea46390bcf76f1d924f4a7d88f1
      DB_NAME: family-cash-flow-staging-v1
    steps:
      - uses: actions/checkout@v4
      - name: Confirm table is absent and financial state is pristine
        run: |
          set -euo pipefail
          npx --yes wrangler@4.123.0 d1 execute "$DB_NAME" --remote --json --command "SELECT (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='salary_cycle_sources') AS source_table,(SELECT current_revision FROM household_revisions WHERE household_id='family') AS revision,(SELECT COUNT(*) FROM financial_write_claims) AS claims,(SELECT COUNT(*) FROM correction_audit) AS corrections;" > /tmp/pre.json
          node <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/pre.json'));const b=Array.isArray(x)?x[0]:x;const r=(b.results||b.result||[])[0];
          if(Number(r.source_table)!==0||Number(r.revision)!==0||Number(r.claims)!==0||Number(r.corrections)!==0)throw new Error('Pre-migration state is not pristine: '+JSON.stringify(r));
          NODE
      - name: Apply salary-cycle source migration
        run: npx --yes wrangler@4.123.0 d1 execute "$DB_NAME" --remote --file cloudflare/slice-c/migrations/0003_salary_cycle_sources.sql
      - name: Verify exact seeded current-cycle membership and unchanged financial state
        run: |
          set -euo pipefail
          npx --yes wrangler@4.123.0 d1 execute "$DB_NAME" --remote --json --command "SELECT cycle_start,source FROM salary_cycle_sources WHERE household_id='family' ORDER BY cycle_start,source;" > /tmp/sources.json
          npx --yes wrangler@4.123.0 d1 execute "$DB_NAME" --remote --json --command "SELECT (SELECT current_revision FROM household_revisions WHERE household_id='family') AS revision,(SELECT COUNT(*) FROM financial_write_claims) AS claims,(SELECT COUNT(*) FROM correction_audit) AS corrections,(SELECT COUNT(*) FROM balance_history) AS balances,(SELECT COUNT(*) FROM ledger_movements) AS ledger,(SELECT COUNT(*) FROM obligation_payments) AS payments;" > /tmp/state.json
          node <<'NODE'
          const fs=require('fs');const rows=f=>{const x=JSON.parse(fs.readFileSync(f));const b=Array.isArray(x)?x[0]:x;return b.results||b.result||[]};
          const sources=rows('/tmp/sources.json');const state=rows('/tmp/state.json')[0];
          const expected=[{cycle_start:'2026-07-31',source:'Alex Salary'},{cycle_start:'2026-07-31',source:'Olga Salary'}];
          if(JSON.stringify(sources)!==JSON.stringify(expected))throw new Error('Unexpected salary source state: '+JSON.stringify(sources));
          if(Number(state.revision)!==0||Number(state.claims)!==0||Number(state.corrections)!==0||Number(state.balances)!==69||Number(state.ledger)!==3||Number(state.payments)!==8)throw new Error('Financial state changed: '+JSON.stringify(state));
          console.log(JSON.stringify({status:'PASS',sources,state},null,2));
          NODE
