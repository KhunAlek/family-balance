name: Staging transport frame diagnostic

on:
  push:
    branches:
      - staging-startup-repair-20260814
    paths:
      - '.github/workflows/staging-transport-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2 --no-save
          npx playwright install --with-deps chromium
      - name: Inspect Apps Script iframe response chain
        run: |
          cat > frame-diagnostic.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const APPS='https://script.google.com/macros/s/AKfycbwtgB7WGkR-XRe19xda5xWmxPg4d_uymyu7wk-Vc0HEQpWdOHTuJ48pj1BIADZ8nOqLUA/exec';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844}});
          const page=await context.newPage();
          const events=[];
          const responses=[];
          const errors=[];
          const root=process.cwd();

          const interesting=u=>u.includes('script.google.com')||u.includes('googleusercontent.com');
          page.on('frameattached', f=>events.push({type:'frameattached',url:f.url()}));
          page.on('framenavigated', f=>events.push({type:'framenavigated',url:f.url(),parent:f.parentFrame()?.url()||null}));
          page.on('console', m=>events.push({type:'console',consoleType:m.type(),text:m.text()}));
          page.on('pageerror', e=>errors.push(String(e)));
          page.on('request', r=>{if(interesting(r.url()))events.push({type:'request',method:r.method(),url:r.url()})});
          page.on('requestfailed', r=>{if(interesting(r.url()))events.push({type:'requestfailed',url:r.url(),error:r.failure()?.errorText||'failed'})});
          page.on('response', async r=>{
            if(!interesting(r.url()))return;
            const rec={url:r.url(),status:r.status(),headers:await r.allHeaders().catch(()=>({}))};
            try{const txt=await r.text();rec.body=txt.slice(0,5000)}catch(e){rec.bodyError=String(e)}
            responses.push(rec);
          });

          const mime=file=>file.endsWith('.html')?'text/html; charset=utf-8':file.endsWith('.js')?'application/javascript; charset=utf-8':file.endsWith('.css')?'text/css; charset=utf-8':file.endsWith('.svg')?'image/svg+xml':'application/octet-stream';
          await page.route('https://khunalek.github.io/family-balance/**',async route=>{
            const u=new URL(route.request().url());
            let rel=decodeURIComponent(u.pathname.replace(/^\/family-balance\/?/,''));
            if(!rel)rel='index.html';
            const file=path.resolve(root,rel);
            if(!file.startsWith(root)||!fs.existsSync(file)||fs.statSync(file).isDirectory())return route.fulfill({status:404,body:'not found'});
            return route.fulfill({status:200,contentType:mime(file),body:fs.readFileSync(file)});
          });
          await page.route('https://accounts.google.com/gsi/client',r=>r.fulfill({status:200,contentType:'application/javascript',body:'window.google=window.google||{};'}));
          await page.route('https://cdn.jsdelivr.net/**',r=>r.fulfill({status:200,contentType:'application/javascript',body:''}));
          await page.route('https://fonts.googleapis.com/**',r=>r.fulfill({status:200,contentType:'text/css',body:''}));
          await page.route('https://fonts.gstatic.com/**',r=>r.fulfill({status:204,body:''}));

          await page.goto('https://khunalek.github.io/family-balance/?frame-diagnostic=1',{waitUntil:'domcontentloaded',timeout:30000});
          const requestId='fcf_diagnostic_fixed';
          await page.evaluate(({APPS,requestId})=>{
            window.__diagMessages=[];
            window.addEventListener('message',event=>window.__diagMessages.push({origin:event.origin,data:event.data}));
            const frame=document.createElement('iframe');
            frame.name='diag_transport';frame.id='diag_transport';
            frame.style.cssText='position:fixed;width:10px;height:10px;left:-10000px;top:-10000px';
            const form=document.createElement('form');
            form.method='POST';form.action=APPS;form.target=frame.name;form.id='diag_form';
            const add=(n,v)=>{const i=document.createElement('input');i.type='hidden';i.name=n;i.value=v;form.appendChild(i)};
            add('transport','iframe');
            add('requestId',requestId);
            add('requestJson',JSON.stringify({apiAction:'authBootstrap',googleAccessToken:'fcf-intentionally-invalid-token-for-frame-diagnostic'}));
            document.body.append(frame,form);
            form.submit();
          },{APPS,requestId});

          await page.waitForTimeout(12000);
          const messages=await page.evaluate(()=>window.__diagMessages||[]);
          const frameSnapshots=[];
          for(const f of page.frames()){
            const snap={url:f.url(),parent:f.parentFrame()?.url()||null};
            try{snap.title=await f.title()}catch(e){snap.titleError=String(e)}
            try{snap.body=(await f.locator('body').innerText({timeout:2000})).slice(0,3000)}catch(e){snap.bodyError=String(e)}
            try{snap.html=(await f.content()).slice(0,5000)}catch(e){snap.htmlError=String(e)}
            frameSnapshots.push(snap);
          }
          console.log(JSON.stringify({messages,errors,events,responses,frameSnapshots},null,2));
          await browser.close();
          EOF
          node frame-diagnostic.mjs
