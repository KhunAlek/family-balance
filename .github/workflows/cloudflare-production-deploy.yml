name: Cloudflare production deploy

on:
  push:
    branches: [main]
    paths:
      - '.assetsignore'
      - 'wrangler.production.jsonc'
      - 'index.html'
      - 'assets/**'
      - 'cloudflare/slice-b/**'
      - 'cloudflare/slice-c/**'
      - 'cloudflare/slice-d/**'
      - '.github/workflows/cloudflare-production-deploy.yml'

permissions:
  contents: read

concurrency:
  group: family-cash-flow-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6ee48ea46390bcf76f1d924f4a7d88f1
      WORKER_NAME: family-cash-flow-production
      WORKER_ORIGIN: https://family-cash-flow-production.abystrov66.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pinned Web Push dependency
        run: npm ci --prefix cloudflare/slice-d --ignore-scripts --no-audit --no-fund

      - name: Assert immutable production configuration
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ! grep -i 'staging' wrangler.production.jsonc
          grep -Fq '"name": "family-cash-flow-production"' wrangler.production.jsonc
          grep -Fq '"database_id": "d605f4fb-f42a-4610-9805-1c4f8b8329b8"' wrangler.production.jsonc
          grep -Fq '"bucket_name": "family-cash-flow-production-backups"' wrangler.production.jsonc
          grep -Fq '"BACKUP_ENVIRONMENT": "production"' wrangler.production.jsonc
          grep -Fq '"0 2,13,20,21 * * *"' wrangler.production.jsonc

      - name: Run accepted tests and production dry run
        run: |
          set -euo pipefail
          (cd cloudflare/slice-b && npm test)
          (cd cloudflare/slice-c && npm test)
          (cd cloudflare/slice-d && npm test)
          find assets -name '*.js' -type f -print0 | xargs -0 -n1 node --check
          node --check cloudflare/slice-d/src/index.js
          node --check sw.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
          npx --yes wrangler@4.123.0 deploy --config wrangler.production.jsonc --dry-run --outdir /tmp/production-dry-run

      - name: Apply idempotent Web Push schema
        run: npx --yes wrangler@4.123.0 d1 execute family-cash-flow-production-v1 --remote --config wrangler.production.jsonc --file cloudflare/slice-d/migrations/0004_web_push_notifications.sql

      - name: Ensure persistent production VAPID key pair exists
        run: |
          set -euo pipefail
          npx --yes wrangler@4.123.0 secret list --name "$WORKER_NAME" --format json > /tmp/secrets-before-vapid.json
          if ! node -e "const x=require('/tmp/secrets-before-vapid.json'); process.exit(x.some(v=>v.name==='VAPID_PUBLIC_KEY')&&x.some(v=>v.name==='VAPID_PRIVATE_KEY')?0:1)"; then
            (cd cloudflare/slice-d && node --input-type=module <<'NODE'
          import { generateVAPIDKeys } from 'web-push-neo';
          import fs from 'node:fs';
          const keys = await generateVAPIDKeys();
          fs.writeFileSync('/tmp/vapid-public', keys.publicKey, { mode: 0o600 });
          fs.writeFileSync('/tmp/vapid-private', keys.privateKey, { mode: 0o600 });
          NODE
            )
            npx --yes wrangler@4.123.0 secret put VAPID_PUBLIC_KEY --name "$WORKER_NAME" < /tmp/vapid-public
            npx --yes wrangler@4.123.0 secret put VAPID_PRIVATE_KEY --name "$WORKER_NAME" < /tmp/vapid-private
            shred -u /tmp/vapid-public /tmp/vapid-private
          fi

      - name: Bootstrap Worker before secret rotation
        run: |
          set -euo pipefail
          npx --yes wrangler@4.123.0 deploy --config wrangler.production.jsonc | tee /tmp/bootstrap-deploy.log

      - name: Install fresh production session-signing secret
        run: |
          set -euo pipefail
          openssl rand -base64 48 | npx --yes wrangler@4.123.0 secret put SESSION_SIGNING_KEY --name "$WORKER_NAME"

      - name: Deploy reviewed main commit as final version
        run: |
          set -euo pipefail
          npx --yes wrangler@4.123.0 deploy --config wrangler.production.jsonc | tee /tmp/final-deploy.log

      - name: Verify runtime and record sanitized deployment evidence
        run: |
          set -euo pipefail
          health_code=000
          for attempt in $(seq 1 90); do
            health_code=$(curl -sS -H 'accept: application/json' -o /tmp/health.json -w '%{http_code}' "$WORKER_ORIGIN/health" || true)
            if [ "$health_code" = 200 ] && node -e "const x=require('/tmp/health.json'); if(!(x.ok===true&&x.service==='family-cash-flow'&&x.runtime==='slice-d'&&x.appsScriptDependency===false))process.exit(1)"; then
              break
            fi
            sleep 2
          done
          test "$health_code" = 200

          root_code=$(curl -sS -o /tmp/root.html -w '%{http_code}' "$WORKER_ORIGIN/")
          test "$root_code" = 200
          grep -Eiq '<!doctype html|<html' /tmp/root.html

          auth_code=$(curl -sS -H 'accept: application/json' -o /tmp/auth.json -w '%{http_code}' "$WORKER_ORIGIN/api/auth/session")
          test "$auth_code" = 401
          node -e "const x=require('/tmp/auth.json'); if(!(x.ok===false&&/Authentication required/.test(x.error)))process.exit(1)"

          npx --yes wrangler@4.123.0 secret list --name "$WORKER_NAME" --format json > /tmp/secrets.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const url=`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${process.env.WORKER_NAME}/schedules`;
          const response=await fetch(url,{headers:{authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`}});
          const result=await response.json();
          if(!response.ok||!result.success) throw new Error('Could not verify production cron schedules.');
          fs.writeFileSync('/tmp/production-crons.json',JSON.stringify((result.result?.schedules||[]).map(x=>x.cron).sort()));
          NODE
          node <<'NODE'
          const fs=require('fs');
          const health=JSON.parse(fs.readFileSync('/tmp/health.json'));
          const secrets=JSON.parse(fs.readFileSync('/tmp/secrets.json'));
          if(!secrets.some(x=>x.name==='SESSION_SIGNING_KEY')) throw new Error('SESSION_SIGNING_KEY is missing');
          if(!secrets.some(x=>x.name==='VAPID_PUBLIC_KEY')) throw new Error('VAPID_PUBLIC_KEY is missing');
          if(!secrets.some(x=>x.name==='VAPID_PRIVATE_KEY')) throw new Error('VAPID_PRIVATE_KEY is missing');
          const config=JSON.parse(fs.readFileSync('wrangler.production.jsonc'));
          const actualCrons=JSON.parse(fs.readFileSync('/tmp/production-crons.json'));
          const expectedCrons=[...config.triggers.crons].sort();
          if(JSON.stringify(actualCrons)!==JSON.stringify(expectedCrons)) throw new Error('Production cron schedules do not match reviewed configuration.');
          const versionPattern=/Current Version ID:\s*([^\s]+)/;
          const bootstrapVersion=fs.readFileSync('/tmp/bootstrap-deploy.log','utf8').match(versionPattern)?.[1] || null;
          const finalVersion=fs.readFileSync('/tmp/final-deploy.log','utf8').match(versionPattern)?.[1] || null;
          if(!bootstrapVersion || !finalVersion || bootstrapVersion===finalVersion) throw new Error('Distinct bootstrap and final Worker versions were not proven.');
          const evidence={
            status:'PASS',
            commit:process.env.GITHUB_SHA,
            runId:process.env.GITHUB_RUN_ID,
            workerName:process.env.WORKER_NAME,
            origin:process.env.WORKER_ORIGIN,
            bootstrapVersion,
            finalVersion,
            d1:config.d1_databases[0],
            r2:config.r2_buckets[0],
            crons:config.triggers.crons,
            secretNames:secrets.map(x=>x.name).sort(),
            health,
            staticRootStatus:200,
            unauthenticatedSessionStatus:401
          };
          fs.writeFileSync('/tmp/production-deployment-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log(JSON.stringify({status:evidence.status,commit:evidence.commit,workerName:evidence.workerName,origin:evidence.origin,bootstrapVersion:evidence.bootstrapVersion,finalVersion:evidence.finalVersion,secretNames:evidence.secretNames}));
          NODE

      - name: Upload sanitized deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-deployment-evidence
          path: /tmp/production-deployment-evidence.json
          if-no-files-found: error
