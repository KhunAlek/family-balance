name: Staging startup browser test

on:
  push:
    branches: [staging-startup-repair-20260814]
  workflow_dispatch:

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2 --no-save
          npx playwright install --with-deps chromium
      - name: Serve staging branch locally
        run: |
          python3 -m http.server 4173 >/tmp/fcf-http.log 2>&1 &
          echo $! > /tmp/fcf-http.pid
          sleep 2
      - name: Run startup tests
        run: |
          cat > staging-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const html = fs.readFileSync('index.html','utf8');
          if (!html.includes('<script src="assets/v24/v24_1_app4.js"></script>')) {
            throw new Error('Direct app4 reference is missing from index.html');
          }
          if (html.includes('assets/v24/v24/v24_1_app4.js')) {
            throw new Error('Obsolete nested app4 reference is still present in index.html');
          }

          const browser = await chromium.launch({headless:true});
          const results = [];

          async function runCase(name, viewport) {
            const context = await browser.newContext({viewport});
            const page = await context.newPage();
            const pageErrors = [];
            const localFailures = [];
            const requested = [];
            let nestedLoaderRequested = false;

            page.on('pageerror', e => pageErrors.push(String(e)));
            page.on('request', r => {
              requested.push(r.url());
              if (r.url().includes('/assets/v24/v24/v24_1_app4.js')) nestedLoaderRequested = true;
            });
            page.on('requestfailed', r => {
              if (r.url().startsWith('http://127.0.0.1:4173/')) {
                localFailures.push(`${r.url()} :: ${r.failure()?.errorText || 'failed'}`);
              }
            });

            // Poison the obsolete loader URL. A correct repaired page must never request it.
            await page.route('**/assets/v24/v24/v24_1_app4.js', route =>
              route.fulfill({status:200,contentType:'application/javascript',body:"throw new Error('obsolete loader executed')"})
            );

            const response = await page.goto('http://127.0.0.1:4173/index.html?case='+name, {waitUntil:'domcontentloaded',timeout:30000});
            if (!response || !response.ok()) throw new Error(`${name}: page HTTP ${response?.status()}`);
            await page.waitForTimeout(3000);

            const loadingVisible = await page.locator('#loadingState').isVisible().catch(()=>false);
            const authVisible = await page.locator('#authGate').isVisible().catch(()=>false);
            const loginVisible = await page.locator('#googleLoginBtn').isVisible().catch(()=>false);
            const errorVisible = await page.locator('#errorState').isVisible().catch(()=>false);
            const app4Requests = requested.filter(u=>u.includes('/assets/v24/v24_1_app4.js'));

            const result = {name,viewport,loadingVisible,authVisible,loginVisible,errorVisible,pageErrors,localFailures,nestedLoaderRequested,app4Requests};
            results.push(result);
            await page.screenshot({path:`staging-${name}.png`,fullPage:true});
            await context.close();

            if (nestedLoaderRequested) throw new Error(`${name}: obsolete nested loader was requested`);
            if (app4Requests.length !== 1) throw new Error(`${name}: expected exactly one direct app4 request, got ${app4Requests.length}`);
            if (pageErrors.length) throw new Error(`${name}: page errors: ${pageErrors.join(' | ')}`);
            if (localFailures.length) throw new Error(`${name}: local request failures: ${localFailures.join(' | ')}`);
            if (errorVisible) throw new Error(`${name}: app error state visible`);
            if (loadingVisible) throw new Error(`${name}: loading screen still visible`);
            if (!authVisible || !loginVisible) throw new Error(`${name}: Google sign-in gate not visible`);
          }

          await runCase('mobile',{width:390,height:844});
          await runCase('desktop',{width:1440,height:900});
          console.log(JSON.stringify(results,null,2));
          await browser.close();
          EOF
          node staging-smoke.mjs
      - name: Upload staging screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-startup-screenshots
          path: staging-*.png
          if-no-files-found: ignore
