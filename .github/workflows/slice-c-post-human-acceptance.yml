name: Slice C post-human authenticated acceptance

on:
  push:
    branches: [staging-startup-repair-20260814]
    paths:
      - '.github/workflows/slice-c-post-human-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6ee48ea46390bcf76f1d924f4a7d88f1
      DB_NAME: family-cash-flow-staging-v1
    steps:
      - name: Query authenticated acceptance evidence from staging D1
        run: |
          set -euo pipefail
          q(){ npx --yes wrangler@4.123.0 d1 execute "$DB_NAME" --remote --json --command "$1"; }
          q "SELECT current_revision,last_write_token,updated_at FROM household_revisions WHERE household_id='family';" > /tmp/revision.json
          q "SELECT household_id,base_revision,write_token,committed_at FROM financial_write_claims WHERE household_id='family' ORDER BY base_revision;" > /tmp/claims.json
          q "SELECT correction_id,entity_type,entity_id,before_json,after_json,reason,actor_email,corrected_at,base_revision,write_token FROM correction_audit WHERE household_id='family' ORDER BY corrected_at;" > /tmp/corrections.json
          q "SELECT balance_row_id,business_date,sheet_order,alex_balance_satang,olga_balance_satang,source_sheet,source_row FROM balance_history WHERE household_id='family' AND business_date='2026-08-14' ORDER BY sheet_order;" > /tmp/acceptance-balances.json
          q "SELECT business_date,alex_balance_satang,olga_balance_satang,source_sheet FROM balance_history WHERE household_id='family' AND alex_balance_satang IS NOT NULL AND olga_balance_satang IS NOT NULL ORDER BY business_date DESC,sheet_order DESC LIMIT 1;" > /tmp/latest.json
          q "SELECT (SELECT COUNT(*) FROM balance_history WHERE household_id='family') AS balances,(SELECT COUNT(*) FROM ledger_movements WHERE household_id='family') AS ledger,(SELECT COUNT(*) FROM obligation_payments WHERE household_id='family') AS payments,(SELECT COUNT(*) FROM weekly_snapshots WHERE household_id='family') AS weekly,(SELECT COUNT(*) FROM salary_cycle_sources WHERE household_id='family') AS salary_sources;" > /tmp/counts.json
      - name: Assert revision claims, unchanged money, and correction audit
        run: |
          node <<'NODE'
          const fs=require('fs');
          function rows(file){
            const x=JSON.parse(fs.readFileSync(file,'utf8'));
            const part=Array.isArray(x)?x[0]:x;
            return part?.results||part?.result||[];
          }
          const revision=rows('/tmp/revision.json')[0];
          const claims=rows('/tmp/claims.json');
          const corrections=rows('/tmp/corrections.json');
          const balances=rows('/tmp/acceptance-balances.json');
          const latest=rows('/tmp/latest.json')[0];
          const counts=rows('/tmp/counts.json')[0];

          if(Number(revision?.current_revision)!==2) throw new Error('Expected revision 2: '+JSON.stringify(revision));
          if(claims.length!==2) throw new Error('Expected exactly 2 claims: '+JSON.stringify(claims));
          if(Number(claims[0].base_revision)!==0||Number(claims[1].base_revision)!==1) throw new Error('Expected claims for base revisions 0 and 1: '+JSON.stringify(claims));
          if(!claims[0].write_token||!claims[1].write_token||claims[0].write_token===claims[1].write_token) throw new Error('Write tokens are missing or reused.');
          if(revision.last_write_token!==claims[1].write_token) throw new Error('Revision last_write_token does not match second claim.');

          if(corrections.length!==1) throw new Error('Expected exactly 1 correction audit: '+JSON.stringify(corrections));
          const audit=corrections[0];
          if(audit.reason!=='Slice C acceptance test') throw new Error('Unexpected correction reason: '+audit.reason);
          if(!audit.actor_email||audit.actor_email==='unknown'||!audit.actor_email.includes('@')) throw new Error('Correction actor was not captured: '+audit.actor_email);
          if(Number(audit.base_revision)!==1) throw new Error('Correction must claim base revision 1: '+JSON.stringify(audit));
          if(audit.write_token!==claims[1].write_token) throw new Error('Correction audit token does not match second claim.');
          if(audit.entity_type!=='balance_history') throw new Error('Unexpected correction entity type: '+audit.entity_type);

          if(balances.length!==2) throw new Error('Expected original + correction balance rows on 14 Aug: '+JSON.stringify(balances));
          const original=balances.find(x=>x.source_sheet==='Cloudflare');
          const replacement=balances.find(x=>x.source_sheet==='Correction');
          if(!original||!replacement) throw new Error('Missing Cloudflare original or Correction replacement: '+JSON.stringify(balances));
          for(const row of [original,replacement]){
            if(Number(row.alex_balance_satang)!==228500||Number(row.olga_balance_satang)!==1145500) throw new Error('Acceptance write changed money: '+JSON.stringify(row));
          }
          if(String(audit.entity_id)!==String(original.balance_row_id)) throw new Error('Audit does not point to the original Cloudflare row.');

          const before=JSON.parse(audit.before_json), after=JSON.parse(audit.after_json);
          if(before.business_date!=='2026-08-14'||Number(before.alex_balance_satang)!==228500||Number(before.olga_balance_satang)!==1145500||before.source_sheet!=='Cloudflare') throw new Error('Audit before_json is wrong: '+audit.before_json);
          if(after.business_date!=='2026-08-14'||Number(after.alex_balance_satang)!==228500||Number(after.olga_balance_satang)!==1145500||after.source_sheet!=='Correction'||String(after.replacementForBalanceRowId)!==String(original.balance_row_id)) throw new Error('Audit after_json is wrong: '+audit.after_json);

          if(latest.business_date!=='2026-08-14'||Number(latest.alex_balance_satang)!==228500||Number(latest.olga_balance_satang)!==1145500||latest.source_sheet!=='Correction') throw new Error('Authoritative latest balance is wrong: '+JSON.stringify(latest));
          const expected={balances:71,ledger:3,payments:8,weekly:8,salary_sources:2};
          for(const [k,v] of Object.entries(expected)) if(Number(counts[k])!==v) throw new Error(`${k}: expected ${v}, got ${counts[k]}`);

          console.log(JSON.stringify({
            status:'PASS',revision:Number(revision.current_revision),claims:claims.length,corrections:corrections.length,
            actor:audit.actor_email,reason:audit.reason,latestBalance:{date:latest.business_date,alex:Number(latest.alex_balance_satang)/100,olga:Number(latest.olga_balance_satang)/100,source:latest.source_sheet},counts
          },null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: slice-c-authenticated-acceptance-evidence
          path: |
            /tmp/revision.json
            /tmp/claims.json
            /tmp/corrections.json
            /tmp/acceptance-balances.json
            /tmp/latest.json
            /tmp/counts.json
