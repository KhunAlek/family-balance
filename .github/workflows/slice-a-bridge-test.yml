name: Slice A bridge test

on:
  push:
    branches: [staging-startup-repair-20260814]
    paths:
      - 'cloudflare/slice-a-bridge/**'
      - 'cloudflare/slice-b/**'
      - 'cloudflare/slice-c/**'
      - '.github/workflows/slice-a-bridge-test.yml'
  workflow_dispatch:

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: |
          node --check cloudflare/slice-a-bridge/src/index.js
          node --check cloudflare/slice-a-bridge/test/bridge.test.mjs
      - name: Run bridge tests
        run: node cloudflare/slice-a-bridge/test/bridge.test.mjs
