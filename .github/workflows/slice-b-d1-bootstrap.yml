name: Slice B staging D1 bootstrap

on:
  push:
    branches: [staging-startup-repair-20260814]
    paths:
      - '.github/workflows/slice-b-d1-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6ee48ea46390bcf76f1d924f4a7d88f1
      DB_NAME: family-cash-flow-staging-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build validated import SQL
        run: node cloudflare/slice-b/tools/build-import.mjs /tmp/import.sql /tmp/source-report.json
      - name: Check D1 access and create fresh staging database
        id: d1
        run: |
          set -euo pipefail
          npx --yes wrangler@4.123.0 d1 list --json > /tmp/d1-list.json
          FOUND=$(node -e "const x=require('/tmp/d1-list.json'); const a=Array.isArray(x)?x:(x.result||[]); const d=a.find(v=>v.name===process.env.DB_NAME); process.stdout.write(d?.uuid||d?.id||'')")
          if [ -n "$FOUND" ]; then
            echo "Existing D1 database $DB_NAME ($FOUND) found; refusing to overwrite it."
            exit 20
          fi
          npx --yes wrangler@4.123.0 d1 create "$DB_NAME" --location apac
          npx --yes wrangler@4.123.0 d1 list --json > /tmp/d1-list-after.json
          DB_ID=$(node -e "const x=require('/tmp/d1-list-after.json'); const a=Array.isArray(x)?x:(x.result||[]); const d=a.find(v=>v.name===process.env.DB_NAME); if(!d)process.exit(2); process.stdout.write(d.uuid||d.id)")
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"
          echo "Created staging D1: $DB_NAME ($DB_ID)"
      - name: Apply schema to fresh D1
        run: npx --yes wrangler@4.123.0 d1 execute "$DB_NAME" --remote --file cloudflare/slice-b/migrations/0001_initial.sql
      - name: Import normalized live snapshot
        run: npx --yes wrangler@4.123.0 d1 execute "$DB_NAME" --remote --file /tmp/import.sql
      - name: Verify remote row counts and named source facts
        run: |
          set -euo pipefail
          npx --yes wrangler@4.123.0 d1 execute "$DB_NAME" --remote --json --command "SELECT (SELECT COUNT(*) FROM balance_history) AS balance_rows,(SELECT COUNT(*) FROM obligations) AS obligation_rows,(SELECT COUNT(*) FROM obligation_payments) AS payment_rows,(SELECT COUNT(*) FROM goals) AS goal_rows,(SELECT COUNT(*) FROM ledger_movements) AS ledger_rows,(SELECT COUNT(*) FROM weekly_snapshots) AS weekly_rows,(SELECT COUNT(*) FROM financial_write_claims) AS write_claim_rows,(SELECT COUNT(*) FROM correction_audit) AS correction_rows;" > /tmp/counts.json
          npx --yes wrangler@4.123.0 d1 execute "$DB_NAME" --remote --json --command "SELECT business_date,source_row,alex_balance_satang,olga_balance_satang FROM balance_history WHERE alex_balance_satang IS NOT NULL AND olga_balance_satang IS NOT NULL ORDER BY business_date DESC,sheet_order DESC LIMIT 1;" > /tmp/current.json
          npx --yes wrangler@4.123.0 d1 execute "$DB_NAME" --remote --json --command "SELECT COALESCE(SUM(CASE WHEN direction='Contribution' THEN amount_satang WHEN direction='Withdrawal' THEN -amount_satang ELSE 0 END),0) AS ef_balance_satang FROM ledger_movements WHERE household_id='family' AND account='EF';" > /tmp/ef.json
          npx --yes wrangler@4.123.0 d1 execute "$DB_NAME" --remote --json --command "WITH x AS (SELECT o.name,o.expected_amount_satang,o.amount_type,o.legacy_paid_this_month,COALESCE(SUM(p.actual_amount_satang),0) AS paid_satang,MAX(CASE WHEN p.payment_status='Final' THEN 1 ELSE 0 END) AS has_final FROM obligations o JOIN obligation_occurrences oc ON oc.household_id=o.household_id AND oc.obligation_name=o.name LEFT JOIN obligation_payments p ON p.household_id=o.household_id AND p.obligation_name=o.name AND p.occurrence_due_date=oc.due_date WHERE o.household_id='family' AND substr(oc.due_date,1,7)='2026-08' GROUP BY o.name,o.expected_amount_satang,o.amount_type,o.legacy_paid_this_month) SELECT SUM(CASE WHEN amount_type='Variable' AND has_final=1 THEN 0 WHEN paid_satang=0 AND legacy_paid_this_month=1 THEN 0 ELSE max(expected_amount_satang-paid_satang,0) END) AS remaining_satang FROM x;" > /tmp/obligations.json
          node <<'NODE'
          const fs=require('fs');
          const rows=file=>{const x=JSON.parse(fs.readFileSync(file)); const batch=Array.isArray(x)?x[0]:x; return batch.results||batch.result||[]};
          const c=rows('/tmp/counts.json')[0];
          const current=rows('/tmp/current.json')[0];
          const ef=rows('/tmp/ef.json')[0];
          const ob=rows('/tmp/obligations.json')[0];
          const expect=(cond,msg)=>{if(!cond)throw new Error(msg)};
          expect(Number(c.balance_rows)===69,'balance row count');
          expect(Number(c.obligation_rows)===8,'obligation row count');
          expect(Number(c.payment_rows)===8,'payment row count');
          expect(Number(c.goal_rows)===1,'goal row count');
          expect(Number(c.ledger_rows)===3,'ledger row count');
          expect(Number(c.weekly_rows)===8,'weekly row count');
          expect(Number(c.write_claim_rows)===0,'write claims must remain empty');
          expect(Number(c.correction_rows)===0,'correction audit must remain empty');
          expect(current.business_date==='2026-08-12' && Number(current.alex_balance_satang)===228500 && Number(current.olga_balance_satang)===1145500,'current balances');
          expect(Number(ef.ef_balance_satang)===13723100,'EF balance');
          expect(Number(ob.remaining_satang)===1400,'remaining obligations');
          console.log(JSON.stringify({status:'PASS',counts:c,current,ef,remainingObligations:ob,database:process.env.DB_NAME},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: slice-b-d1-bootstrap-evidence
          path: |
            /tmp/source-report.json
            /tmp/d1-list-after.json
            /tmp/counts.json
            /tmp/current.json
            /tmp/ef.json
            /tmp/obligations.json
          if-no-files-found: error
